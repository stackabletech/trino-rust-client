# File-based PASSWORD authenticator, enabled purely so the coordinator is
# configured with MORE THAN ONE authentication type. Trino then emits one
# `WWW-Authenticate` challenge header per type, in `http-server.authentication.type`
# order — which is exactly the case the client's challenge parsing has to survive
# (see config.properties).
password-authenticator.name=file
file.password-file=/etc/trino/password.db
